[tool.poetry]
name = "sadhaka-content-agents-backend"
version = "0.1.0"
description = "Phase 1 core loop backend for Sadhaka Content Agent CMS"
authors = ["Sadhaka Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
sqlalchemy = "^2.0.43"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
ruff = "^0.12.9"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
