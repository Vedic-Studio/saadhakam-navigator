<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Submerged stone structures and anchors beneath a waterline">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C87941"/>
      <stop offset="1" stop-color="#8B5A2E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sea)"/>
  <!-- waterline + ripples (top sky band slightly lighter) -->
  <rect width="1200" height="150" fill="#16314d" opacity="0.6"/>
  <g stroke="#F5E6C8" stroke-width="2" opacity="0.25" fill="none">
    <path d="M 0 150 Q 100 138 200 150 T 400 150 T 600 150 T 800 150 T 1000 150 T 1200 150"/>
    <path d="M 0 168 Q 100 158 200 168 T 400 168 T 600 168 T 800 168 T 1000 168 T 1200 168" opacity="0.6"/>
  </g>
  <!-- sikhara watermark faint, submerged -->
  <g transform="translate(900,250) scale(3.2)" fill="#3a6ea5" opacity="0.12">
    <rect x="4" y="88" width="92" height="5"/>
    <path fill-rule="evenodd" d="M 12 88 V 79 H 17 V 70 H 22 V 61 H 27 V 52 H 32 V 43 H 37 V 34 H 63 V 43 H 68 V 52 H 73 V 61 H 78 V 70 H 83 V 79 H 88 V 88 H 12 Z M 32 86 L 50 40 L 68 86 Z"/>
    <ellipse cx="50" cy="27" rx="11" ry="2.5"/>
    <circle cx="50" cy="20" r="3"/>
  </g>
  <!-- submerged stone blocks (a ruined wall) -->
  <g fill="url(#stone)">
    <rect x="120" y="430" width="120" height="80" rx="6"/>
    <rect x="250" y="430" width="120" height="80" rx="6" opacity="0.92"/>
    <rect x="380" y="430" width="120" height="80" rx="6" opacity="0.85"/>
    <rect x="185" y="345" width="120" height="80" rx="6" opacity="0.9"/>
    <rect x="315" y="345" width="120" height="80" rx="6" opacity="0.8"/>
    <rect x="250" y="260" width="120" height="80" rx="6" opacity="0.78"/>
  </g>
  <!-- stone anchors (triangular with ring + holes) -->
  <g stroke="#D4A843" stroke-width="6" fill="none" opacity="0.85">
    <g transform="translate(640,360)">
      <circle cy="-44" r="12"/>
      <path d="M 0 -32 L -34 44 L 34 44 Z"/>
      <circle cx="0" cy="14" r="6" fill="#071321"/>
    </g>
    <g transform="translate(780,400) scale(0.8)">
      <circle cy="-44" r="12"/>
      <path d="M 0 -32 L -34 44 L 34 44 Z"/>
      <circle cx="0" cy="14" r="6" fill="#071321"/>
    </g>
  </g>
  <!-- rising bubbles -->
  <g fill="#F5E6C8" opacity="0.4">
    <circle cx="520" cy="300" r="5"/>
    <circle cx="540" cy="250" r="3.4"/>
    <circle cx="528" cy="210" r="2.4"/>
  </g>
</svg>
