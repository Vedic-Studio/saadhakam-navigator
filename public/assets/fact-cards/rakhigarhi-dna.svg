<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An ancient DNA strand with no Steppe ancestry marker at 2,500 BCE">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1330"/>
      <stop offset="1" stop-color="#0f0a1c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <!-- sikhara watermark -->
  <g transform="translate(70,150) scale(3.6)" fill="#E07B39" opacity="0.08">
    <rect x="4" y="88" width="92" height="5"/>
    <path fill-rule="evenodd" d="M 12 88 V 79 H 17 V 70 H 22 V 61 H 27 V 52 H 32 V 43 H 37 V 34 H 63 V 43 H 68 V 52 H 73 V 61 H 78 V 70 H 83 V 79 H 88 V 88 H 12 Z M 32 86 L 50 40 L 68 86 Z"/>
    <ellipse cx="50" cy="27" rx="11" ry="2.5"/>
    <circle cx="50" cy="20" r="3"/>
    <circle cx="50" cy="13" r="2"/>
  </g>
  <!-- Double helix: two sine strands with rungs -->
  <g transform="translate(0,315)" fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M 320 -150 C 460 -90, 460 90, 600 150 C 740 210, 740 -210, 880 -150" stroke="#E07B39"/>
    <path d="M 320 150 C 460 90, 460 -90, 600 -150 C 740 -210, 740 210, 880 150" stroke="#D4A843"/>
  </g>
  <!-- helix rungs -->
  <g stroke="#F5E6C8" stroke-width="4" opacity="0.55">
    <line x1="360" y1="225" x2="360" y2="405"/>
    <line x1="440" y1="250" x2="440" y2="380"/>
    <line x1="520" y1="285" x2="520" y2="345"/>
    <line x1="600" y1="245" x2="600" y2="385"/>
    <line x1="680" y1="285" x2="680" y2="345"/>
    <line x1="760" y1="250" x2="760" y2="380"/>
    <line x1="840" y1="225" x2="840" y2="405"/>
  </g>
  <!-- "no Steppe" gap marker: a hollow ring with a slash -->
  <g transform="translate(980,315)">
    <circle r="58" fill="none" stroke="#8B1A2D" stroke-width="10"/>
    <line x1="-41" y1="41" x2="41" y2="-41" stroke="#8B1A2D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="96" y="520" width="1008" height="3" fill="#D4A843" opacity="0.4"/>
</svg>
