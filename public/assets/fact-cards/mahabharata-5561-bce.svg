<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A field of star positions converging on a single dated point">
  <defs>
    <radialGradient id="bg3" cx="0.62" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#241634"/>
      <stop offset="1" stop-color="#0c0717"/>
    </radialGradient>
    <radialGradient id="focus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E07B39"/>
      <stop offset="1" stop-color="#E07B39" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <!-- sikhara watermark -->
  <g transform="translate(60,160) scale(3.4)" fill="#D4A843" opacity="0.07">
    <rect x="4" y="88" width="92" height="5"/>
    <path fill-rule="evenodd" d="M 12 88 V 79 H 17 V 70 H 22 V 61 H 27 V 52 H 32 V 43 H 37 V 34 H 63 V 43 H 68 V 52 H 73 V 61 H 78 V 70 H 83 V 79 H 88 V 88 H 12 Z M 32 86 L 50 40 L 68 86 Z"/>
    <ellipse cx="50" cy="27" rx="11" ry="2.5"/>
    <circle cx="50" cy="20" r="3"/>
    <circle cx="50" cy="13" r="2"/>
  </g>
  <!-- scattered stars -->
  <g fill="#F5E6C8">
    <circle cx="180" cy="120" r="3" opacity="0.7"/>
    <circle cx="320" cy="80" r="2.4" opacity="0.5"/>
    <circle cx="500" cy="140" r="3.4" opacity="0.8"/>
    <circle cx="700" cy="90" r="2.2" opacity="0.5"/>
    <circle cx="900" cy="150" r="3" opacity="0.6"/>
    <circle cx="1040" cy="110" r="2.6" opacity="0.5"/>
    <circle cx="240" cy="300" r="2.6" opacity="0.55"/>
    <circle cx="1080" cy="320" r="3" opacity="0.6"/>
    <circle cx="160" cy="470" r="2.8" opacity="0.5"/>
    <circle cx="380" cy="520" r="2.4" opacity="0.45"/>
    <circle cx="560" cy="500" r="3" opacity="0.6"/>
    <circle cx="820" cy="520" r="2.6" opacity="0.5"/>
    <circle cx="980" cy="480" r="2.8" opacity="0.55"/>
  </g>
  <!-- convergence lines into the focal point -->
  <g stroke="#D4A843" stroke-width="1.6" opacity="0.4">
    <line x1="180" y1="120" x2="640" y2="300"/>
    <line x1="500" y1="140" x2="640" y2="300"/>
    <line x1="900" y1="150" x2="640" y2="300"/>
    <line x1="240" y1="300" x2="640" y2="300"/>
    <line x1="1080" y1="320" x2="640" y2="300"/>
    <line x1="380" y1="520" x2="640" y2="300"/>
    <line x1="820" y1="520" x2="640" y2="300"/>
  </g>
  <!-- focal "single date" point -->
  <circle cx="640" cy="300" r="120" fill="url(#focus)" opacity="0.5"/>
  <circle cx="640" cy="300" r="30" fill="#E07B39"/>
  <circle cx="640" cy="300" r="46" fill="none" stroke="#E07B39" stroke-width="3" opacity="0.7"/>
  <circle cx="640" cy="300" r="64" fill="none" stroke="#D4A843" stroke-width="2" opacity="0.4"/>
</svg>
